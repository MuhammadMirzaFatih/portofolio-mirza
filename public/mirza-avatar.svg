<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="neon-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with Neon Border -->
  <circle cx="200" cy="200" r="195" fill="url(#avatar-bg)"/>
  <circle cx="200" cy="200" r="190" stroke="url(#neon-ring)" stroke-width="4" stroke-dasharray="12 6"/>

  <!-- Subtle glow -->
  <circle cx="200" cy="180" r="110" fill="#22D3EE" opacity="0.12" filter="blur(40px)"/>

  <!-- Character Silhouette / Modern Designer Avatar -->
  <!-- Body / Shoulders -->
  <path d="M100 370 C 100 290, 140 260, 200 260 C 260 260, 300 290, 300 370 Z" fill="#1E293B" stroke="#334155" stroke-width="3"/>
  
  <!-- Navy Blue T-Shirt collar -->
  <path d="M165 260 Q 200 295 235 260 Z" fill="#0F172A"/>
  
  <!-- Neck -->
  <rect x="180" y="210" width="40" height="60" rx="8" fill="#FBBF24"/>
  
  <!-- Head -->
  <ellipse cx="200" cy="170" rx="55" ry="65" fill="#FCD34D"/>
  
  <!-- Modern Hair -->
  <path d="M145 160 C 145 110, 175 95, 200 95 C 235 95, 255 110, 255 160 C 255 130, 240 110, 200 110 C 160 110, 148 135, 145 160 Z" fill="#0F172A"/>
  
  <!-- Glasses -->
  <rect x="155" y="150" width="38" height="28" rx="8" fill="none" stroke="#22D3EE" stroke-width="3.5"/>
  <rect x="207" y="150" width="38" height="28" rx="8" fill="none" stroke="#22D3EE" stroke-width="3.5"/>
  <line x1="193" y1="162" x2="207" y2="162" stroke="#22D3EE" stroke-width="3"/>

  <!-- Eyes behind glasses -->
  <circle cx="174" cy="164" r="4.5" fill="#0F172A"/>
  <circle cx="226" cy="164" r="4.5" fill="#0F172A"/>

  <!-- Eyebrows -->
  <path d="M160 142 Q 174 137 188 142" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212 142 Q 226 137 240 142" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M182 195 Q 200 212 218 195" fill="none" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Figma Cursor Tag Overlay -->
  <g transform="translate(260, 220)">
    <polygon points="0,0 8,24 14,16 22,22 25,18 17,12 24,8" fill="#A855F7" stroke="#FFFFFF" stroke-width="1.5"/>
    <rect x="20" y="22" width="75" height="24" rx="6" fill="#A855F7"/>
    <text x="28" y="38" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Mirza (UX)</text>
  </g>

  <!-- Open to Work Badge Floating -->
  <g transform="translate(30, 70)">
    <rect width="130" height="32" rx="16" fill="#082F49" stroke="#0284C7" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="5" fill="#22D3EE"/>
    <text x="32" y="20" fill="#E0F2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Internship Ready</text>
  </g>
</svg>
