<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad-3" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A1208"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#2D1505"/>
    </linearGradient>
    <linearGradient id="amber-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="food-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="20" fill="url(#bg-grad-3)"/>

  <!-- Glows -->
  <circle cx="240" cy="150" r="150" fill="#F59E0B" opacity="0.12" filter="blur(70px)"/>
  <circle cx="650" cy="380" r="140" fill="#EA580C" opacity="0.14" filter="blur(65px)"/>

  <!-- Mobile Device Frames Mockup -->
  <!-- Left Phone (Customer Ordering App) -->
  <g transform="translate(140, 40)">
    <rect width="250" height="420" rx="32" fill="#0F172A" stroke="#334155" stroke-width="4"/>
    <!-- Phone Notch / Dynamic Island -->
    <rect x="75" y="10" width="100" height="18" rx="9" fill="#020617"/>

    <!-- App Header -->
    <text x="24" y="52" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Nin's Kitchen 🍲</text>
    <text x="24" y="68" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Pempek Asli Palembang · Fresh & Frozen</text>

    <!-- Banner Promo -->
    <rect x="18" y="80" width="214" height="65" rx="12" fill="#78350F" stroke="#B45309" stroke-width="1"/>
    <text x="28" y="102" fill="#FEF08A" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Paket Hemat Juara</text>
    <text x="28" y="118" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="8">10 Kapal Selam + 10 Lenjer + Cuko Kental</text>
    <text x="28" y="134" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Rp 125.000</text>

    <!-- Product Card 1 -->
    <g transform="translate(18, 155)">
      <rect width="214" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="8" y="8" width="48" height="48" rx="8" fill="#451A03"/>
      <!-- Food icon inside -->
      <circle cx="32" cy="32" r="16" fill="url(#amber-glow)"/>
      <text x="24" y="36" fill="#78350F" font-family="system-ui, sans-serif" font-size="13" font-weight="800">🥟</text>
      
      <text x="64" y="24" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Pempek Kapal Selam</text>
      <text x="64" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">Isi telur utuh · Cuko pedas gurih</text>
      <text x="64" y="54" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Rp 15.000 / pcs</text>
      
      <!-- Plus Button -->
      <circle cx="195" cy="34" r="12" fill="#F59E0B"/>
      <text x="191" y="38" fill="#451A03" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+</text>
    </g>

    <!-- Product Card 2 -->
    <g transform="translate(18, 228)">
      <rect width="214" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
      <rect x="8" y="8" width="48" height="48" rx="8" fill="#3B1E08"/>
      <!-- Food icon inside -->
      <circle cx="32" cy="32" r="16" fill="url(#food-plate)"/>
      <text x="24" y="36" fill="#431407" font-family="system-ui, sans-serif" font-size="13" font-weight="800">🍲</text>
      
      <text x="64" y="24" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tekwan Spesial Tenggiri</text>
      <text x="64" y="38" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">Kuah udang gurih + sohun + jamur</text>
      <text x="64" y="54" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Rp 22.000 / porsi</text>
      
      <!-- Plus Button -->
      <circle cx="195" cy="34" r="12" fill="#F59E0B"/>
      <text x="191" y="38" fill="#451A03" font-family="system-ui, sans-serif" font-size="12" font-weight="700">+</text>
    </g>

    <!-- Bottom Checkout Bar -->
    <g transform="translate(18, 335)">
      <rect width="214" height="52" rx="12" fill="#047857"/>
      <text x="16" y="24" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="9">Total: 2 Menu Dipilih</text>
      <text x="16" y="42" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Rp 52.000</text>
      <text x="120" y="32" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Pesan WhatsApp 💬</text>
    </g>
  </g>

  <!-- Right Phone (Kitchen Dashboard) -->
  <g transform="translate(420, 50)">
    <rect width="240" height="400" rx="28" fill="#0B1329" stroke="#1E293B" stroke-width="3"/>
    
    <text x="20" y="40" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="13" font-weight="700">📋 Antrean Dapur Hari Ini</text>
    <text x="20" y="56" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9">5 Pesanan Baru Siap Kirim</text>

    <!-- Order Item 1 -->
    <g transform="translate(14, 70)">
      <rect width="212" height="74" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5"/>
      <text x="12" y="20" fill="#10B981" font-family="system-ui, sans-serif" font-size="9" font-weight="700">#ORD-104 · SUDAH TRANSFER</text>
      <text x="12" y="38" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Ibu Ratna (Surabaya Timur)</text>
      <text x="12" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">1x Paket Hemat (Vakum) · Cuko Pedas</text>
      <rect x="150" y="40" width="50" height="22" rx="4" fill="#047857"/>
      <text x="158" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Selesai</text>
    </g>

    <!-- Order Item 2 -->
    <g transform="translate(14, 155)">
      <rect width="212" height="74" rx="8" fill="#1E293B" stroke="#D97706" stroke-width="1"/>
      <text x="12" y="20" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="9" font-weight="700">#ORD-105 · SEDANG DIMASAK</text>
      <text x="12" y="38" fill="#F1F5F9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Pak Hendra (Sidoarjo)</text>
      <text x="12" y="52" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8">2x Tekwan Tenggiri · Siap Santap</text>
      <rect x="150" y="40" width="50" height="22" rx="4" fill="#B45309"/>
      <text x="160" y="55" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="8" font-weight="600">Kemas</text>
    </g>

    <!-- Metric Card -->
    <g transform="translate(14, 240)">
      <rect width="212" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
      <text x="14" y="22" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9">Total Omzet Pesanan Hari Ini</text>
      <text x="14" y="45" fill="#10B981" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Rp 1.480.000</text>
      <text x="150" y="45" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="9">+60% Efisiensi</text>
    </g>
  </g>

  <!-- Tag Pill overlay -->
  <g transform="translate(85, 420)">
    <rect width="180" height="28" rx="14" fill="#451A03" stroke="#D97706" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#F59E0B"/>
    <text x="28" y="18" fill="#FDE68A" font-family="system-ui, sans-serif" font-size="10" font-weight="600">UMKM Digital Transformation</text>
  </g>
</svg>
